services:
  engine:
    build: .
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - engine-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  engine-data:

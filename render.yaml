# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Creating this Blueprint provisions paid compute and a persistent disk.
services:
  - type: web
    name: synairgy-engine
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r lead-engine/requirements.txt
    startCommand: python -m synairgy.cli serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: engine-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHONPATH
        value: lead-engine/src
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONDONTWRITEBYTECODE
        value: '1'
      - key: WEB_CONCURRENCY
        value: '1'
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PORTFOLIO_ENABLED
        value: '1'
      - key: OUTREACH_ENABLED
        value: '0'
      - key: AUTO_APPROVE_OUTREACH
        value: '0'
      - key: STRIPE_LIVE_MODE
        value: '0'
      - key: DAILY_SEND_LIMIT
        value: '20'
      - key: DAILY_AI_CALL_LIMIT
        value: '30'

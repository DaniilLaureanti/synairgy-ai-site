name: SynAirgy Lead Engine

on:
  push:
    branches: [main, 'codex/lead-engine-v2*', 'codex/market-portfolio*']
    paths: ['lead-engine/**', '.github/workflows/synairgy-lead-engine.yml']
  pull_request:
    paths: ['lead-engine/**', '.github/workflows/synairgy-lead-engine.yml']
  schedule:
    - cron: '10 9 * * 1-5'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      query:
        description: Optional manual query; empty uses market research and portfolio allocation
        type: string
      limit:
        description: New-company capacity across all selected sectors (1-20)
        default: '20'
        type: string
      dry_run:
        description: Readiness check only; no discovery or sending
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: synairgy-lead-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lead-engine/requirements*.txt
      - name: Install
        run: python -m pip install -r lead-engine/requirements-dev.txt
      - name: Unit and end-to-end tests (no live services)
        working-directory: lead-engine
        run: python -m pytest -q
      - name: Preserve existing marketing site
        run: node tests/site-structure.mjs

  runtime:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENGINE_ENABLED == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: lead-engine
    env:
      LEAD_ENGINE_URL: ${{ vars.LEAD_ENGINE_URL }}
      LEAD_ENGINE_ADMIN_TOKEN: ${{ secrets.LEAD_ENGINE_ADMIN_TOKEN }}
      LEAD_QUERY: ${{ inputs.query }}
      LEAD_LIMIT: ${{ inputs.limit }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      PYTHONPATH: lead-engine/src
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install HTTP dependency
        run: python -m pip install requests==2.32.5
      - name: Call persistent engine
        run: python -m synairgy.schedule

  activation-status:
    if: github.event_name == 'schedule' && vars.ENGINE_ENABLED != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why production is not running
        run: |
          echo "::notice::Engine is NOT activated. Configure persistent runtime and ENGINE_ENABLED=1."
          echo "Production run skipped: persistent runtime is not activated. Tests do not imply live service readiness." >> "$GITHUB_STEP_SUMMARY"
